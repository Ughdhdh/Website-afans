<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>Горизонтальный список</title>
        <style> ul.hr {
        margin: 0; /*Обнуляем значение отступов*/ padding: 4px; /*Значение полей*/
        }
        ul.hr li {
        display:	inline;	/*Отображать	как	строчный	эле-
        
        мент*/
        

        margin-right: 5px; /*Отступ слева*/
        border: 1px solid #000; /*Рамка вокруг текста*/ padding: 3px; /*Поля вокруг текста*/
        }
        </style>
    </head>
    <body>
        <ul class="hr">
        <li>Фотокарточки</li>
        <li>Истории</li>
        <li>Визитка</li>
        <li>Другое</li>
        </ul>
    </body>
</html>
