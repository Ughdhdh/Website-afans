<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Часть II - Сложные таблицы</title>
    <style>
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        table {
            width: 150px;
            height: 150px;
            text-align: center;
        }
        td {
            border: 2px solid #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Использование атрибутов rowspan и colspan</h2>
    <div class="container">

        <table>
            <tr>
                <td rowspan="2">1</td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
            </tr>
        </table>

        <table>
            <tr>
                <td>1</td>
                <td>2</td>
            </tr>
            <tr>
                <td colspan="2">3</td>
            </tr>
        </table>

        <table>
            <tr>
                <td>1</td>
                <td rowspan="2">2</td>
            </tr>
            <tr>
                <td>3</td>
            </tr>
        </table>

        <table>
            <tr>
                <td colspan="3">1</td>
            </tr>
            <tr>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
        </table>

    </div>

</body>
</html>
