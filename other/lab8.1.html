<!DOCTYPE HTML>
<html lang="ru">
    <head>
        <title>Форма</title>
    </head>
    <body>
        <form action="">
            <table border="1" cellpadding="5">
            <caption align="left">
                <b> Анкета web-разработчика </b>
            </caption>
            <tr>
                <td>E-mail*</td>
                <td><input required autofocus tabindex="1" type="email" name="email"></td>
            </tr>
            <tr>
                <td>Пароль*</td>
                <td><input required tabindex="2" type="password" name="pass"></td>
            </tr>
            <tr>
            <td>Пол</td>
                <td>
                <input type="radio" name="gender" id="g1" value="1" tabindex="3">
                <label for="g1">Мужчина</label>
                <input type="radio" name="gender" id="g2" value="2" tabindex="4">
                <label for="g2">Женщина</label>
                </td>
            </tr>
            <tr>
                <td>Год рождения</td>
                <td>
                    <select name="year" size="1" tabindex="5">
                    <option value="1984" selected>1984</option>
                    <option value="1985">1985</option>
                    <option value="1986">1986</option>
                    <option value="1987">1987</option>
                    <option value="1988">1988</option>
                    <option value="1989">1989</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Дата выхода на работу</td>
                <td><input type="date" name="start_date" tabindex="6"></td>
            </tr>
            <tr>
                <td>Опыт работы (лет)</td>
                <td><input type="number" name="experience" min="0" max="50" value="0" tabindex="7"></td>
            </tr>
            <tr>
                <td>Знание языков</td>
                <td>
                    <input tabindex="8" type="checkbox" name="languadg" value="Inglish" checked>Английский<br>
                    <input tabindex="9" type="checkbox" name="languadg" value="Rushen">Русский<br>
                    <input tabindex="10" type="checkbox" name="languadg" value="Doich" checked>Немецкий<br>
                    <input tabindex="11" type="checkbox" name="languadg" value="Spain">Испанский<br>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                
                <textarea tabindex="12" name="description" cols="40" rows="10">Коротко о себе...	</textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Отправить" tabindex="13">
                    <button type="reset" tabindex="14">Сбросить</button>
                </td>
            </tr>
            </table>
        </form>
    </body>
</html>
