<!DOCTYPE HTML>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Заявка на вступление в фанулуб</title>
        <link rel="stylesheet" href="CSS/form.css">
    </head>
    <body>
        <header>
            <h2>Для вступления заполните форму</h2>
            <h3 id="0"><a href="index.html">на главную</a></h3>
        </header>
        <main>
            <br>
            <br>
            <br>
            <form id="club-form" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="8c75d66f-0e8d-43bc-94e9-4b8550d19265">
                <input type="hidden" name="subject" value="Новая заявка в фанклуб">
                <input type="hidden" name="from_name" value="Сайт фанклуба">
                <!-- ловушка для ботов: людям не видна, боты её отмечают -->
                <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">
                <table class="form-table">
                    <caption>
                    <b>Анкета участника</b>
                    </caption>
                    <tr>
                    <td class="label-cell"><label for="last_name">Фамилия*</label></td>
                    <td><input required type="text" name="last_name" id="last_name" autocomplete="family-name"></td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="first_name">Имя*</label></td>
                    <td><input required type="text" name="first_name" id="first_name" autocomplete="given-name"></td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="patronymic">Отчество*</label></td>
                    <td><input required type="text" name="patronymic" id="patronymic" autocomplete="additional-name"></td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="email">E-mail*</label></td>
                    <td><input required type="email" name="email" id="email" placeholder="example@mail.com"></td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="pass">Пароль*</label></td>
                    <td><input required type="password" name="pass" id="pass" placeholder="Введите пароль"></td>
                    </tr>
                    <tr>
                    <td class="label-cell">Пол</td>
                    <td class="options-cell">
                        <label><input type="radio" name="gender" value="Мужчина"> Мужчина</label>
                        <label><input type="radio" name="gender" value="Женщина"> Женщина</label>
                        <label><input type="radio" name="gender" value="Небинарность"> Небинарность</label>
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="birthdate">Дата рождения</label></td>
                    <td>
                        <input type="date" name="birthdate" id="birthdate">
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="color">Любимый цвет</label></td>
                    <td>
                        <input type="color" name="favorite_color" id="color">
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="number">Любимое число</label></td>
                    <td>
                        <input type="number" name="favorite_number" id="number" min="0">
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="range">Насколько любите Р.А.С.</label></td>
                    <td>
                        <input type="range" name="love_ras" id="range" min="0" max="10">
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell">Знание языков</td>
                    <td class="options-cell languages-grid">
                        <label><input type="checkbox" name="language" value="Английский"> Английский</label>
                        <label><input type="checkbox" name="language" value="Русский" checked> Русский</label>
                        <label><input type="checkbox" name="language" value="Немецкий"> Немецкий</label>
                        <label><input type="checkbox" name="language" value="Испанский"> Испанский</label>
                        <label><input type="checkbox" name="language" value="Французский"> Французский</label>
                        <label><input type="checkbox" name="language" value="Китайский"> Китайский</label>
                        <label><input type="checkbox" name="language" value="Другое"> Другое</label>
                    </td>
                    </tr>
                    <tr>
                    <td colspan="2" class="textarea-cell">
                        <label for="description" style="display:block; margin-bottom: 8px;">Коротко о себе:</label>
                        <textarea name="description" id="description" rows="6" placeholder="Коротко о себе..."></textarea>
                    </td>
                    </tr>
                    <tr>
                    <td colspan="2" class="options-cell agree-cell">
                        <label><input required type="checkbox" name="agreement" value="Да"> Я согласен(на) с <a href="agreement.html" target="_blank">пользовательским соглашением</a>*</label>
                    </td>
                    </tr>
                    <tr>
                    <td colspan="2" class="buttons-cell">
                        <button type="submit" class="btn btn-submit">Отправить</button>
                        <button type="reset" class="btn btn-reset">Сбросить</button>
                        <p id="form-status" role="status"></p>
                    </td>
                    </tr>
                </table>
            </form>
            <br>
            <br>
            <br>
        </main>
        <script>
            document.getElementById('club-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                var form = e.target;
                var btn = form.querySelector('.btn-submit');
                var status = document.getElementById('form-status');
                var data = {};
                // собираем все поля; несколько отмеченных языков склеиваем через запятую
                new FormData(form).forEach(function (v, k) {
                    data[k] = (k in data) ? data[k] + ', ' + v : v;
                });
                btn.disabled = true;
                status.textContent = 'Отправка...';
                try {
                    var r = await fetch(form.action, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                        body: JSON.stringify(data)
                    });
                    var j = await r.json();
                    if (j.success) { window.location.href = 'thanks.html'; return; }
                    throw new Error(j.message);
                } catch (err) {
                    status.textContent = 'Не удалось отправить заявку. Попробуйте ещё раз позже.';
                    btn.disabled = false;
                }
            });
        </script>
    </body>
</html>
