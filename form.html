<!DOCTYPE HTML>
<html lang="ru">
    <head>
        <title>Заявка на вступление в фанулуб</title>
        <link rel="stylesheet" href="CSS/form.css">
    </head>
    <body>
        <header>
            <h2>Для вступления заполните форму</h2>
            <h3 id="0"><a href="index.html">на главную</a></h3>
        </header>
        <main>
            <br>
            <form action="#" method="POST">
                <table class="form-table">
                    <caption>
                    <b>Анкета участника</b>
                    </caption>
                    <tr>
                    <td class="label-cell"><label for="email">E-mail*</label></td>
                    <td><input required type="email" name="email" id="email" placeholder="example@mail.com"></td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="pass">Пароль*</label></td>
                    <td><input required type="password" name="pass" id="pass" placeholder="Введите пароль"></td>
                    </tr>
                    <tr>
                    <td class="label-cell">Пол</td>
                    <td class="options-cell">
                        <label><input type="radio" name="gender" value="1"> Мужчина</label>
                        <label><input type="radio" name="gender" value="2"> Женщина</label>
                        <label><input type="radio" name="gender" value="3"> Небинарность</label>
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="birthdate">Дата рождения</label></td>
                    <td>
                        <input type="date" name="birthdate" id="birthdate">
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="color">Любимый цвет</label></td>
                    <td>
                        <input type="color" name="favorite_color" id="color">
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="number">Любимое число</label></td>
                    <td>
                        <input type="number" name="favorite_number" id="number" min="0">
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell"><label for="range">Насколько любите Р.А.С.</label></td>
                    <td>
                        <input type="range" name="love_ras" id="range" min="0" max="10">
                    </td>
                    </tr>
                    <tr>
                    <td class="label-cell">Знание языков</td>
                    <td class="options-cell languages-grid">
                        <label><input type="checkbox" name="language" value="en"> Английский</label>
                        <label><input type="checkbox" name="language" value="ru" checked> Русский</label>
                        <label><input type="checkbox" name="language" value="de"> Немецкий</label>
                        <label><input type="checkbox" name="language" value="es"> Испанский</label>
                        <label><input type="checkbox" name="language" value="fr"> Французский</label>
                        <label><input type="checkbox" name="language" value="zh"> Китайский</label>
                        <label><input type="checkbox" name="language" value="other"> Другое</label>
                    </td>
                    </tr>
                    <tr>
                    <td colspan="2" class="textarea-cell">
                        <label for="description" style="display:block; margin-bottom: 8px;">Коротко о себе:</label>
                        <textarea name="description" id="description" rows="6" placeholder="Коротко о себе..."></textarea>
                    </td>
                    </tr>
                    <tr>
                    <td colspan="2" class="buttons-cell">
                        <button type="submit" class="btn btn-submit">Отправить</button>
                        <button type="reset" class="btn btn-reset">Сбросить</button>
                    </td>
                    </tr>
                </table>
            </form>
        </main>
    </body>
</html>
