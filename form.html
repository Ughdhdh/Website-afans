<!DOCTYPE HTML>
<html lang="ru">
    <head>
        <title>Заявка на вступление в фанулуб</title>
        <link rel="stylesheet" href="CSS/form.css">
    </head>
    <body>
        <h2>Для вступления заполните форму</h2>
        <form action="">
            <table border="1" cellpadding="5">
            <caption>
                <b> Анкета участника </b>
            </caption>
            <tr>
                <td>E-mail*</td>
                <td><input required type="email" name="email"></td>
            </tr>
            <tr>
                <td>Пароль*</td>
                <td><input required type="password" name="pass"></td>
            </tr>
            <tr>
            <td>Пол</td>
                <td>
                <input type="radio" name="gender" id="g1" val- ue="1">
                <label for="g1">Мужчина</label>
                <input type="radio" name="gender" id="g2" val- ue="2">
                <label for="g2">Женщина</label>
                </td>
            </tr>
            <tr>
                <td>Год рождения</td>
                <td>
                    <select name="year" size="1">
                    <option value="1983">1999</option>
                    <option value="1984">2000</option>
                    <option value="1985">2001</option>
                    <option value="1986">2002</option>
                    <option value="1987">2003</option>
                    <option value="1988">2004</option>
                    <option value="1989">2005</option>
                    <option value="1990">2006</option>
                    <option value="1991">2007</option>
                    <option value="1992" selected>2008</option>
                    <option value="1993">2009</option>
                    <option value="1994">2010</option>
                    <option value="1995">2011</option>
                    <option value="1996">2012</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Знание языков</td>
                <td>
                    <input type="checkbox" name="languadg" val- ue="Inglish">Английский<br>
                    <input type="checkbox" name="languadg" val- ue="Rushen" checked>Русский<br>
                    <input type="checkbox" name="languadg" val- ue="Doich">Немецкий<br>
                    <input type="checkbox" name="languadg" val- ue="Spain">Испанский<br>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                
                <textarea name="description" cols="40" rows="10">Коротко о себе...	</textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <input type="submit" value="Отправить">
                    <button type="reset">Сбросить</button>
                </td>
            </tr>
            </table>
        </form>
        <footer>
            <hr>
            <h3 id="0"><a href="main.html">на главную</a></h3>
        </footer>
    </body>
</html>
