<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Фоточки</title>
        <link rel="stylesheet" href="CSS/photoes.css">
        <script type="text/javascript" src="JS/jquery.js"></script>
        <script type="text/javascript" src="JS/jquery.cross-slide.js"></script>
        <script type="text/javascript">
            $(function() {
            $('#gallery').crossSlide({ sleep: 2, fade: 1
            }, [
            { src: 'img/2.jpg' },
            { src: 'img/1.jpg' },
            { src: 'img/3.jpg' },
            { src: 'img/5.jpg' },
            { src: 'img/4.jpg' }
            ]);
            });
        </script>
        <style type="text/css"> 
            #gallery {
                margin: 1em auto;
                border: 2px solid #000000; 
                width: 600px;
                height: 500px;
            }
            
            @media (max-width: 640px) {
                #gallery {
                    width: 92%;
                    height: auto;
                    aspect-ratio: 6 / 5;
                }
            }

            #gallery img {
                width: 100%;
                height: 100%;
                object-fit: fill; 
            }
        </style>
    </head>
    <body>

        <header>
            <h3 id="0"><a href="index.html">на главную</a></h3>
        </header>

        <main>
            <div style="text-align: center;" id="gallery">
                Если изображения не видно, обновите страницу
            </div>
            <hr style=" border: none; border-top: 1px solid #000000; margin: 0 5% 0px 5%;">
            <br>
            <img src="img/2.jpg">
            <img src="img/1.jpg">
            <img src="img/3.jpg">
            <img src="img/4.jpg">
            <img src="img/5.jpg">
        </main>
    
    </body>
</html>
